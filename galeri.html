<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />

    <title>Galeri Kopi Tani Laras - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />

  <body>
    <nav class="nav" aria-label="Navigasi utama">

    <main class="page">
      <h1>Galeri Kopi Tani Laras</h1>

      <section aria-labelledby="media-title">
        <h2 id="media-title">Media Usaha</h2>

        <div class="gallery-list">
          <figure class="media-card">
            <img
            class="crop-top"
            src="images/tanilaras.jpg"
            alt="Biji kopi Tani Laras"
            />
            <figcaption>
              Dipilih dari biji kopi terbaik.
            </figcaption>
          </figure>

            <figure class="media-card">
                <img
                src="images/kopibubuk.jpg"
                alt="Kopi bubuk Robusta Tani Laras"
                />
            <figcaption>
              Kopi bubuk Robusta Tani Laras, siap diseduh untuk dinikmati sehari-hari.
            </figcaption>
          </figure>

            <figure class="media-card">
                <img
                src="images/robustanatural.jpg"
                alt="Kopi tubruk Robusta Tani Laras"
                />
            <figcaption>
                Kopi tubruk Robusta Natural dengan karakter yang khas.
            </figcaption>
         </figure>

            <figure class="media-card">
                <img
                src="images/robustawine.jpg"
                alt="Kopi tubruk Robusta Tani Laras"
                />
                <figcaption>
                Kopi tubruk Robusta Wine dengan cita rasa yang unik.
            </figcaption>
        </div>
      </section>

      <section aria-labelledby="audio-title">
        <h2 id="audio-title">Cerita Singkat Kopi Tani Laras</h2>
        <p id="audio-note">
             Audio singkat sebagai pelengkap suasana pada galeri Kopi Tani Laras.
        </p>

      <audio controls aria-describedby="audio-note" src="assets/audio/nadakedai.mp3">
        Browser Anda tidak mendukung pemutar audio.
      </audio>
      </section>
