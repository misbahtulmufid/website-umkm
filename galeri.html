        <div class="gallery-grid">

          src="images/tanilaras.jpg"

        />

          Dipilih dari biji kopi terbaik.
        </figcaption>
      </figure>

  <figure class="media-card">

        src="images/sangrai.jpg"
        width="736"
        height="1104"

      />

        Proses sangrai biji kopi.
    </figcaption>
  </figure>

  <figure class="media-card">
    <img
        src="images/kopibubuk.jpg"
        width="1280"
        height="1280"

      Kopi bubuk Robusta Tani Laras, siap diseduh untuk dinikmati sehari-hari.
    </figcaption>
  </figure>

  <figure class="media-card">
    <img
      src="images/robustanatural.jpg"

      height="1280"

      Kopi tubruk Robusta Natural dengan karakter yang khas.

  <figure class="media-card">

    height="1280"

      Kopi tubruk Robusta Wine dengan cita rasa yang unik.

  </figure>

  <figure class="media-card">

    src="images/produk.jpg"
    width="1280"
